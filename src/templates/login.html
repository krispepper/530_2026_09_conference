<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
</head>
<body>
    <h1>Log in</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
        <label for="user_id">User ID</label>
        <input type="text" name="user_id" id="user_id" required autofocus>
        <button type="submit">Log in</button>
    </form>
</body>
</html>
